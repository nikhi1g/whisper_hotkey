name: Build macOS preview DMG

on:
  push:
    tags: ["v*-preview.*"]

permissions:
  contents: write

jobs:
  preview:
    runs-on: macos-15
    steps:
      - name: Check out preview ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate preview ref
        run: |
          test "${GITHUB_REF_TYPE}" = "tag"
          case "${GITHUB_REF_NAME}" in
            "v$(cat VERSION)"-preview.*) ;;
            *) exit 1 ;;
          esac

      - name: Install CMake
        run: brew install cmake

      - name: Build pinned whisper.cpp for macOS 14
        run: |
          WHISPER_SOURCE="${RUNNER_TEMP}/whisper.cpp-1.9.1"
          WHISPER_BUILD="${RUNNER_TEMP}/whisper.cpp-build"
          WHISPER_PREFIX="${RUNNER_TEMP}/whisper.cpp-install"
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp.git "${WHISPER_SOURCE}"
          test "$(git -C "${WHISPER_SOURCE}" rev-parse HEAD)" = "f049fff95a089aa9969deb009cdd4892b3e74916"
          cmake -S "${WHISPER_SOURCE}" -B "${WHISPER_BUILD}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_INSTALL_PREFIX="${WHISPER_PREFIX}" \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DGGML_METAL=ON \
            -DBUILD_SHARED_LIBS=ON
          cmake --build "${WHISPER_BUILD}" --parallel
          cmake --install "${WHISPER_BUILD}"
          echo "WHISPER_CPP_PREFIX=${WHISPER_PREFIX}" >> "${GITHUB_ENV}"
          echo "GGML_PREFIX=${WHISPER_PREFIX}" >> "${GITHUB_ENV}"
          echo "HOMEBREW_PREFIX=$(brew --prefix)" >> "${GITHUB_ENV}"

      - name: Create isolated preview signing identity
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/whisper-hotkey-preview.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          IDENTITY_NAME="whisper_hotkey Preview ${GITHUB_RUN_ID}"
          CERTIFICATE_PATH="${RUNNER_TEMP}/preview.crt"
          PRIVATE_KEY_PATH="${RUNNER_TEMP}/preview.key"
          P12_PATH="${RUNNER_TEMP}/preview.p12"
          P12_PASSWORD="$(uuidgen)$(uuidgen)"
          openssl req -new -newkey rsa:2048 -x509 -sha256 -days 365 -nodes \
            -subj "/CN=${IDENTITY_NAME}/O=whisper_hotkey Preview/" \
            -addext "basicConstraints=critical,CA:true" \
            -addext "keyUsage=critical,digitalSignature,keyCertSign" \
            -addext "extendedKeyUsage=critical,codeSigning" \
            -keyout "${PRIVATE_KEY_PATH}" -out "${CERTIFICATE_PATH}"
          openssl pkcs12 -export -inkey "${PRIVATE_KEY_PATH}" \
            -in "${CERTIFICATE_PATH}" -name "${IDENTITY_NAME}" \
            -passout "pass:${P12_PASSWORD}" -out "${P12_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${P12_PATH}" -k "${KEYCHAIN_PATH}" \
            -P "${P12_PASSWORD}" -A -t cert -f pkcs12
          security add-trusted-cert -r trustRoot -p codeSign \
            -k "${KEYCHAIN_PATH}" "${CERTIFICATE_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          echo "WHISPER_HOTKEY_CODESIGN_IDENTITY=${IDENTITY_NAME}" >> "${GITHUB_ENV}"
          echo "PREVIEW_KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

      - name: Download and verify bundled Base English model
        run: |
          MODEL_PATH="${RUNNER_TEMP}/ggml-base.en.bin"
          curl --fail --location --retry 3 --output "${MODEL_PATH}" \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin"
          echo "a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002  ${MODEL_PATH}" | shasum -a 256 --check
          echo "WHISPER_HOTKEY_BUNDLED_MODEL_PATH=${MODEL_PATH}" >> "${GITHUB_ENV}"

      - name: Test
        run: swift test

      - name: Build self-contained preview app
        env:
          WHISPER_HOTKEY_BUNDLE_MODEL: "1"
        run: python3 build_app.py

      - name: Create preview DMG
        run: |
          python3 tools/package_dmg.py --preview \
            --output dist/release/whisper_hotkey-preview.dmg

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --prerelease \
            --title "whisper_hotkey $(cat VERSION) preview" \
            --notes "Non-Developer-ID testing preview. Includes the verified Base English model. macOS requires Privacy & Security > Open Anyway on first launch."
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            dist/release/whisper_hotkey-preview.dmg \
            dist/release/whisper_hotkey-preview.dmg.sha256

      - name: Remove temporary preview signing keychain
        if: always()
        run: |
          if test -n "${PREVIEW_KEYCHAIN_PATH:-}" && test -f "${PREVIEW_KEYCHAIN_PATH}"; then
            security delete-keychain "${PREVIEW_KEYCHAIN_PATH}"
          fi
