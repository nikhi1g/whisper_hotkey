name: Build macOS preview DMG

on:
  push:
    tags: ["v*-preview.*"]

permissions:
  contents: write

jobs:
  preview:
    runs-on: macos-15
    steps:
      - name: Check out preview ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate preview ref
        run: |
          test "${GITHUB_REF_TYPE}" = "tag"
          case "${GITHUB_REF_NAME}" in
            "v$(cat VERSION)"-preview.*) ;;
            *) exit 1 ;;
          esac

      - name: Install CMake
        run: brew install cmake

      - name: Build pinned whisper.cpp for macOS 14
        run: |
          WHISPER_SOURCE="${RUNNER_TEMP}/whisper.cpp-1.9.1"
          WHISPER_BUILD="${RUNNER_TEMP}/whisper.cpp-build"
          WHISPER_PREFIX="${RUNNER_TEMP}/whisper.cpp-install"
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp.git "${WHISPER_SOURCE}"
          test "$(git -C "${WHISPER_SOURCE}" rev-parse HEAD)" = "f049fff95a089aa9969deb009cdd4892b3e74916"
          cmake -S "${WHISPER_SOURCE}" -B "${WHISPER_BUILD}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_INSTALL_PREFIX="${WHISPER_PREFIX}" \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DGGML_METAL=ON \
            -DGGML_OPENMP=OFF \
            -DBUILD_SHARED_LIBS=ON
          cmake --build "${WHISPER_BUILD}" --parallel
          cmake --install "${WHISPER_BUILD}"
          echo "WHISPER_CPP_PREFIX=${WHISPER_PREFIX}" >> "${GITHUB_ENV}"
          echo "GGML_PREFIX=${WHISPER_PREFIX}" >> "${GITHUB_ENV}"
          echo "HOMEBREW_PREFIX=$(brew --prefix)" >> "${GITHUB_ENV}"

      - name: Download and verify bundled models
        run: |
          CACHE="${HOME}/.cache/whisper"
          mkdir -p "${CACHE}"
          download() {
            curl --fail --location --retry 3 --output "${CACHE}/$1" \
              "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$1"
            echo "$2  ${CACHE}/$1" | shasum -a 256 --check
          }
          download ggml-base.en.bin \
            a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002
          download ggml-small.en.bin \
            c6138d6d58ecc8322097e0f987c32f1be8bb0a18532a3f88f734d1bbf9c41e5d
          download ggml-large-v3-turbo-q5_0.bin \
            394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2

      - name: Test
        run: swift test

      - name: Build self-contained preview app
        env:
          WHISPER_HOTKEY_BUNDLE_MODEL: "1"
          WHISPER_HOTKEY_PREVIEW: "1"
          WHISPER_HOTKEY_CODESIGN_IDENTITY: "-"
        run: python3 build_app.py

      - name: Create preview DMG
        run: |
          python3 tools/package_dmg.py --preview \
            --output dist/release/whisper_hotkey-preview.dmg

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --prerelease \
            --title "whisper_hotkey $(cat VERSION) preview" \
            --notes "Ad-hoc-signed testing preview. Includes the verified Base English model. macOS requires Privacy & Security > Open Anyway on first launch."
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            dist/release/whisper_hotkey-preview.dmg \
            dist/release/whisper_hotkey-preview.dmg.sha256
