name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every other workflow here can be run on demand. CI could not, so a push
  # whose event GitHub failed to deliver left no way to get a run at all.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install whisper.cpp
        run: brew install whisper-cpp
      - name: Configure Homebrew paths
        run: |
          echo "WHISPER_CPP_PREFIX=$(brew --prefix whisper-cpp)" >> "$GITHUB_ENV"
          echo "GGML_PREFIX=$(brew --prefix ggml)" >> "$GITHUB_ENV"
          echo "HOMEBREW_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Test bootstrap and release scripts
        run: python3 Tests/BootstrapTests/test_run_sh.py
