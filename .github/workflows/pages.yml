name: Deploy product site to Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "VERSION"
      - "Assets/AppIcon.png"
      - ".github/workflows/pages.yml"
  # Publishing a release redeploys the site, so the version and the main commit
  # it advertises refresh without a separate commit touching site/.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Always main, never the release tag. The site advertises the current
      # main commit, and a release event would otherwise check out the tag and
      # stamp a commit that is not what "View source" links to.
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Assemble static site
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          commit="$(git rev-parse HEAD)"
          short_sha="${commit:0:7}"
          mkdir -p _site/assets
          cp -R site/. _site/
          cp Assets/AppIcon.png _site/assets/icon.png
          # Stamp both into the HTML so the page is correct before any script
          # runs, and repeat them in build.json for the live refresh.
          sed -i "s|main:latest|main:${short_sha}|g" _site/index.html
          sed -i "s|VERSION_PLACEHOLDER|v${version}|g" _site/index.html
          printf '{"branch":"main","commit":"%s","version":"%s"}\n' \
            "${commit}" "${version}" > _site/build.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
