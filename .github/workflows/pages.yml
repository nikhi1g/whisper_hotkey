name: Deploy product site to Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "Assets/AppIcon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Assemble static site
        run: |
          mkdir -p _site/assets
          cp -R site/. _site/
          cp Assets/AppIcon.png _site/assets/icon.png
          short_sha="${GITHUB_SHA:0:7}"
          sed -i "s|main:latest|${GITHUB_REF_NAME}:${short_sha}|g" _site/index.html
          printf '{"branch":"%s","commit":"%s"}\n' "${GITHUB_REF_NAME}" "${GITHUB_SHA}" > _site/build.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
