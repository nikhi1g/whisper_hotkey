name: Build notarized macOS release

on:
  push:
    tags:
      - "v*"
      - "!v*-preview.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      RELEASE_REF_TYPE: ${{ github.ref_type }}
      RELEASE_REF_NAME: ${{ github.ref_name }}
      CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
      CERTIFICATE_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release ref and secrets
        run: |
          test "${RELEASE_REF_TYPE}" = "tag"
          test "${RELEASE_REF_NAME}" = "v$(cat VERSION)"
          test -n "${CERTIFICATE_P12_BASE64}"
          test -n "${CERTIFICATE_P12_PASSWORD}"
          test -n "${NOTARY_APPLE_ID}"
          test -n "${NOTARY_PASSWORD}"
          test -n "${APPLE_TEAM_ID}"

      - name: Install CMake
        run: brew install cmake

      - name: Build pinned whisper.cpp for macOS 14
        run: |
          WHISPER_SOURCE="${RUNNER_TEMP}/whisper.cpp-1.9.1"
          WHISPER_BUILD="${RUNNER_TEMP}/whisper.cpp-build"
          WHISPER_PREFIX="${RUNNER_TEMP}/whisper.cpp-install"
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp.git "${WHISPER_SOURCE}"
          test "$(git -C "${WHISPER_SOURCE}" rev-parse HEAD)" = "f049fff95a089aa9969deb009cdd4892b3e74916"
          cmake -S "${WHISPER_SOURCE}" -B "${WHISPER_BUILD}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_INSTALL_PREFIX="${WHISPER_PREFIX}" \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DGGML_METAL=ON \
            -DBUILD_SHARED_LIBS=ON
          cmake --build "${WHISPER_BUILD}" --parallel
          cmake --install "${WHISPER_BUILD}"
          echo "WHISPER_CPP_PREFIX=${WHISPER_PREFIX}" >> "${GITHUB_ENV}"
          echo "GGML_PREFIX=${WHISPER_PREFIX}" >> "${GITHUB_ENV}"
          echo "HOMEBREW_PREFIX=$(brew --prefix)" >> "${GITHUB_ENV}"

      - name: Import Developer ID certificate
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/whisper-hotkey-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id-application.p12"
          printf '%s' "${CERTIFICATE_P12_BASE64}" | base64 --decode > "${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -k "${KEYCHAIN_PATH}" -P "${CERTIFICATE_P12_PASSWORD}" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          echo "RELEASE_KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

      - name: Download and verify bundled Base English model
        run: |
          MODEL_PATH="${RUNNER_TEMP}/ggml-base.en.bin"
          curl --fail --location --retry 3 --output "${MODEL_PATH}" \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin"
          echo "a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002  ${MODEL_PATH}" | shasum -a 256 --check
          echo "WHISPER_HOTKEY_BUNDLED_MODEL_PATH=${MODEL_PATH}" >> "${GITHUB_ENV}"

      - name: Test
        run: swift test

      - name: Build Developer ID-signed app with bundled model
        env:
          WHISPER_HOTKEY_BUNDLE_MODEL: "1"
          WHISPER_HOTKEY_DISTRIBUTION: "1"
        run: python3 build_app.py

      - name: Create source archive
        run: python3 tools/package_release.py "${GITHUB_REF_NAME}"

      - name: Create, notarize, and staple DMG
        run: python3 tools/package_dmg.py --notarize

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --title "whisper_hotkey $(cat VERSION)" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            dist/release/whisper_hotkey.dmg \
            dist/release/whisper_hotkey.dmg.sha256 \
            dist/release/whisper_hotkey-*-source.tar.gz \
            dist/release/whisper_hotkey-*-source.tar.gz.sha256

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if test -n "${RELEASE_KEYCHAIN_PATH:-}" && test -f "${RELEASE_KEYCHAIN_PATH}"; then
            security delete-keychain "${RELEASE_KEYCHAIN_PATH}"
          fi
