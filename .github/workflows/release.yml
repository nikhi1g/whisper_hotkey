name: Build signed macOS release

on:
  push:
    tags:
      - "v*"
      - "!v*-preview.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      RELEASE_REF_TYPE: ${{ github.ref_type }}
      RELEASE_REF_NAME: ${{ github.ref_name }}
      CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
      CERTIFICATE_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_PASSWORD }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release ref and secrets
        run: |
          test "${RELEASE_REF_TYPE}" = "tag"
          test "${RELEASE_REF_NAME}" = "v$(cat VERSION)"
          test -n "${CERTIFICATE_P12_BASE64}"
          test -n "${CERTIFICATE_P12_PASSWORD}"

      - name: Install CMake
        run: brew install cmake

      - name: Build pinned whisper.cpp for macOS 14
        run: |
          WHISPER_SOURCE="${RUNNER_TEMP}/whisper.cpp-1.9.1"
          WHISPER_BUILD="${RUNNER_TEMP}/whisper.cpp-build"
          WHISPER_PREFIX="${RUNNER_TEMP}/whisper.cpp-install"
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp.git "${WHISPER_SOURCE}"
          test "$(git -C "${WHISPER_SOURCE}" rev-parse HEAD)" = "f049fff95a089aa9969deb009cdd4892b3e74916"
          cmake -S "${WHISPER_SOURCE}" -B "${WHISPER_BUILD}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_INSTALL_PREFIX="${WHISPER_PREFIX}" \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DGGML_METAL=ON \
            -DGGML_OPENMP=OFF \
            -DBUILD_SHARED_LIBS=ON
          cmake --build "${WHISPER_BUILD}" --parallel
          cmake --install "${WHISPER_BUILD}"
          echo "WHISPER_CPP_PREFIX=${WHISPER_PREFIX}" >> "${GITHUB_ENV}"
          echo "GGML_PREFIX=${WHISPER_PREFIX}" >> "${GITHUB_ENV}"
          echo "HOMEBREW_PREFIX=$(brew --prefix)" >> "${GITHUB_ENV}"

      - name: Import signing certificate
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/whisper-hotkey-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          CERTIFICATE_PATH="${RUNNER_TEMP}/apple-signing-certificate.p12"
          printf '%s' "${CERTIFICATE_P12_BASE64}" | base64 --decode > "${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -k "${KEYCHAIN_PATH}" -P "${CERTIFICATE_P12_PASSWORD}" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          echo "RELEASE_KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

      - name: Download and verify bundled models
        run: |
          CACHE="${HOME}/.cache/whisper"
          mkdir -p "${CACHE}"
          download() {
            curl --fail --location --retry 3 --output "${CACHE}/$1" \
              "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$1"
            echo "$2  ${CACHE}/$1" | shasum -a 256 --check
          }
          download ggml-base.en.bin \
            a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002
          download ggml-small.en.bin \
            c6138d6d58ecc8322097e0f987c32f1be8bb0a18532a3f88f734d1bbf9c41e5d
          download ggml-large-v3-turbo-q5_0.bin \
            394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2

      - name: Test
        run: swift test

      - name: Build signed app with bundled model
        env:
          WHISPER_HOTKEY_BUNDLE_MODEL: "1"
          WHISPER_HOTKEY_DISTRIBUTION: "1"
          WHISPER_HOTKEY_UNNOTARIZED: "1"
        run: python3 build_app.py

      - name: Create source archive
        run: python3 tools/package_release.py "${GITHUB_REF_NAME}"

      - name: Create download ZIP
        run: python3 tools/package_zip.py

      - name: Create DMG for the in-app updater
        run: python3 tools/package_dmg.py --unnotarized

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --title "whisper_hotkey $(cat VERSION)" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            dist/release/whisper_hotkey.zip \
            dist/release/whisper_hotkey.zip.sha256 \
            dist/release/whisper_hotkey.dmg \
            dist/release/whisper_hotkey.dmg.sha256 \
            dist/release/whisper_hotkey-*-source.tar.gz \
            dist/release/whisper_hotkey-*-source.tar.gz.sha256

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if test -n "${RELEASE_KEYCHAIN_PATH:-}" && test -f "${RELEASE_KEYCHAIN_PATH}"; then
            security delete-keychain "${RELEASE_KEYCHAIN_PATH}"
          fi
